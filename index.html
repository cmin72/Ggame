<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리들의 채팅방</title>
  <style>
    :root { --yellow:#f9e000; --line:#d8d8d8; --ink:#333; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:#d9e1e8;
      font-family:Tahoma, "Malgun Gothic", sans-serif; color:var(--ink);
      display:flex; justify-content:center; align-items:center; padding:18px;
    }
    .window {
      width:min(100%, 440px); height:min(780px, calc(100vh - 36px));
      min-height:520px; background:#fff; border:1px solid #9aa5ad;
      border-radius:8px; overflow:hidden; display:flex; flex-direction:column;
      box-shadow:0 8px 28px #34495e35;
    }
    .topbar {
      height:38px; flex:none; background:var(--yellow); display:flex;
      align-items:center; justify-content:space-between; padding:0 12px;
      font-size:13px; font-weight:bold; border-bottom:1px solid #e4cf00;
    }
    .top-icons { letter-spacing:5px; font-size:14px; }
    .room-head {
      background:#fff; padding:14px 16px 12px; border-bottom:1px solid #eee;
      display:flex; align-items:center; justify-content:space-between;
    }
    .room-title { font-size:18px; font-weight:bold; }
    .room-sub { font-size:11px; color:#999; margin-top:4px; }
    .head-right { color:#888; font-size:12px; }
    .notice {
      background:#fff9c9; color:#786c25; font-size:11px; text-align:center;
      padding:8px 10px; border-bottom:1px solid #f1e9ae;
    }
    .messages {
      flex:1; overflow-y:auto; padding:16px 13px 20px;
      background-color:#b7c8d8;
      background-image:radial-gradient(#ffffff55 1px, transparent 1px);
      background-size:8px 8px;
    }
    .date-pill {
      width:max-content; margin:2px auto 17px; padding:5px 11px;
      border-radius:12px; background:#8295a6aa; color:white; font-size:10px;
    }
    .msg { display:flex; gap:7px; margin:0 0 13px; align-items:flex-start; }
    .msg.mine { justify-content:flex-end; }
    .avatar {
      width:32px; height:32px; border-radius:11px; background:#f4d5a6;
      display:grid; place-items:center; font-size:17px; flex:none;
      border:1px solid #ffffffaa;
    }
    .bubble-wrap { max-width:76%; }
    .name { font-size:11px; color:#364451; margin:0 0 4px 2px; }
    .bubble-line { display:flex; align-items:flex-end; gap:5px; }
    .mine .bubble-line { flex-direction:row-reverse; }
    .bubble {
      padding:8px 10px; border-radius:3px 12px 12px 12px;
      background:#fff; font-size:13px; line-height:1.45;
      overflow-wrap:anywhere; box-shadow:0 1px 1px #42515c22;
      white-space:pre-wrap;
    }
    .mine .bubble { background:#ffeb33; border-radius:12px 3px 12px 12px; }
    .time { font-size:9px; color:#53616d; white-space:nowrap; }
    .composer {
      background:#f7f7f7; border-top:1px solid #ddd; padding:10px;
      flex:none;
    }
    .nickname-row { display:flex; gap:6px; margin-bottom:8px; }
    input, button { font:inherit; }
    #nickname {
      width:100%; border:1px solid #ddd; border-radius:4px; padding:7px 9px;
      background:white; font-size:12px; outline:none;
    }
    .input-row { display:flex; gap:7px; align-items:stretch; }
    #message {
      flex:1; resize:none; height:48px; border:1px solid #ddd; border-radius:5px;
      padding:9px; font-size:13px; outline:none; background:#fff;
    }
    #send {
      width:64px; border:1px solid #e0c900; border-radius:5px;
      background:var(--yellow); font-weight:bold; font-size:12px; cursor:pointer;
    }
    #send:active { transform:translateY(1px); }
    .bottom-note { font-size:10px; color:#999; margin-top:7px; text-align:right; }
    .status { font-size:10px; color:#777; margin:0 0 7px 2px; }
    @media (max-width:480px) {
      body { padding:0; background:#fff; }
      .window { width:100%; height:100dvh; min-height:0; border:0; border-radius:0; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="topbar">
      <span>● 우리들의 채팅방</span>
      <span class="top-icons">－ □ ×</span>
    </div>
    <header class="room-head">
      <div>
        <div class="room-title">수다방</div>
        <div class="room-sub">옛날 감성으로 다시 모인 우리</div>
      </div>
      <div class="head-right">☰　⚙</div>
    </header>
    <div class="notice">닉네임을 정하고 메시지를 보내 보세요. 누구나 볼 수 있는 공개 채팅방이에요.</div>
    <section class="messages" id="messages" aria-live="polite">
      <div class="date-pill">오늘</div>
      <div class="status" id="status">채팅 서버에 연결하는 중...</div>
    </section>
    <footer class="composer">
      <div class="nickname-row">
        <input id="nickname" maxlength="16" placeholder="닉네임 (최대 16자)" aria-label="닉네임">
      </div>
      <div class="input-row">
        <textarea id="message" maxlength="500" placeholder="메시지를 입력하세요. (Enter 전송 / Shift+Enter 줄바꿈)" aria-label="메시지"></textarea>
        <button id="send" type="button">전송</button>
      </div>
      <div class="bottom-note">추억의 메신저 느낌으로 만든 채팅방</div>
    </footer>
  </main>

  <!-- Firebase 설정을 입력하면 여러 사람이 실시간으로 대화할 수 있어요. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    // Firebase 콘솔에서 발급받은 설정으로 아래 값을 바꿔 주세요.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const nicknameEl = document.getElementById("nickname");
    const messageEl = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    let db = null;
    let authUser = null;
    let unsubscribe = null;

    nicknameEl.value = localStorage.getItem("retroChatNickname") || "";

    function addMessage(data, mine) {
      const row = document.createElement("div");
      row.className = "msg" + (mine ? " mine" : "");

      if (!mine) {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🙂";
        row.appendChild(avatar);
      }

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      if (!mine) {
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = data.nickname || "익명";
        wrap.appendChild(name);
      }

      const line = document.createElement("div");
      line.className = "bubble-line";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = data.text || "";
      const time = document.createElement("span");
      time.className = "time";
      const date = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date();
      time.textContent = date.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"});
      line.append(bubble, time);
      wrap.appendChild(line);
      row.appendChild(wrap);

      if (mine) {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🙂";
        row.appendChild(avatar);
      }
      messagesEl.appendChild(row);
    }

    function showError(message) {
      statusEl.textContent = message;
      statusEl.style.color = "#b33";
    }

    async function startChat() {
      if (firebaseConfig.apiKey === "YOUR_API_KEY" || firebaseConfig.projectId === "YOUR_PROJECT_ID") {
        statusEl.textContent = "Firebase 설정이 아직 없어요. README 파일의 설정 방법을 먼저 따라 해 주세요.";
        return;
      }
      try {
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        db = firebase.firestore();
        await auth.signInAnonymously();
        authUser = auth.currentUser;
        statusEl.textContent = "실시간 채팅에 연결됐어요.";
        const query = db.collection("messages").orderBy("createdAt", "asc").limitToLast(100);
        unsubscribe = query.onSnapshot(snapshot => {
          messagesEl.querySelectorAll(".msg").forEach(el => el.remove());
          snapshot.forEach(doc => {
            const data = doc.data();
            addMessage(data, data.uid === authUser.uid);
          });
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }, error => showError("메시지를 불러오지 못했어요: " + error.message));
      } catch (error) {
        showError("연결 실패: " + error.message);
      }
    }

    async function sendMessage() {
      const text = messageEl.value.trim();
      const nickname = nicknameEl.value.trim().slice(0, 16);
      if (!text) return;
      if (!nickname) {
        nicknameEl.focus();
        statusEl.textContent = "먼저 닉네임을 입력해 주세요.";
        return;
      }
      if (!db || !authUser) {
        statusEl.textContent = "아직 채팅 서버에 연결되지 않았어요. Firebase 설정을 확인해 주세요.";
        return;
      }
      sendBtn.disabled = true;
      try {
        localStorage.setItem("retroChatNickname", nickname);
        await db.collection("messages").add({
          text: text.slice(0, 500),
          nickname,
          uid: authUser.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        messageEl.value = "";
        messageEl.focus();
      } catch (error) {
        statusEl.textContent = "전송 실패: " + error.message;
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    messageEl.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    window.addEventListener("beforeunload", () => { if (unsubscribe) unsubscribe(); });
    startChat();
  </script>
</body>
</html>
